<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101714">
<title>CYBERMYCELIUM — Нулевой узел</title>
<style>
:root{font-family:Georgia,serif;color:#f2e8d5;background:#0b0e0d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body:before{content:"";position:fixed;inset:-30px;background:url('./assets/atrium.webp') center/cover;filter:blur(38px) brightness(.18);z-index:-1}
#app{position:fixed;inset:0;display:grid;place-items:center}#frame{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9;overflow:hidden;background:#101818;box-shadow:0 24px 90px #000a}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:absolute;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;gap:20px;pointer-events:none;text-shadow:0 2px 12px #000,0 0 8px #000}#hud h1{font:600 clamp(16px,2.1vw,29px)/1.1 Georgia,serif;letter-spacing:.23em;margin:0;color:#f4e8d3}#place{font:12px/1.5 monospace;letter-spacing:.14em;color:#ddb879;margin-top:8px}#objective{max-width:340px;text-align:right;font:13px/1.5 monospace;color:#e4dac6}
#footer{position:absolute;bottom:18px;left:24px;right:24px;display:flex;align-items:end;justify-content:space-between;gap:16px;pointer-events:none;text-shadow:0 2px 8px #000}#prompt{font:13px/1.5 monospace;color:#f3e4ce;max-width:55%;background:#0a1110a8;border-left:2px solid #bb824c;padding:9px 12px;min-height:38px}#actions{display:flex;gap:8px;pointer-events:auto}button{cursor:pointer;border:1px solid #b18c61;background:#14201fe3;color:#f2e4cc;font:12px/1 monospace;letter-spacing:.07em;padding:12px 15px;border-radius:2px;min-height:42px}button:hover,button:focus-visible{background:#394039;outline:1px solid #ecc28b}.active{background:#2c4e50;border-color:#7dc0c4}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#030707bd;z-index:4;padding:16px}#modal.show{display:flex}#panel{width:min(560px,94vw);max-height:min(85vh,650px);overflow:auto;padding:28px 32px;background:linear-gradient(135deg,#15201f,#0c1213);border:1px solid #977958;box-shadow:0 20px 80px #000;color:#e9decb}#panel small{font:11px monospace;letter-spacing:.2em;color:#a8c4c1}#panel h2{font:normal 27px Georgia,serif;color:#efc48b;margin:12px 0}#panel p{line-height:1.6;font-size:16px}#panel .choices{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}#panel .end{display:flex;justify-content:flex-end;margin-top:20px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b1314;color:#d6ad78;font:14px monospace;letter-spacing:.16em;z-index:3}#loading.hidden{display:none}#rotate{display:none}
@media(max-width:650px){#hud{top:10px;left:12px;right:12px}#place{font-size:10px;margin-top:4px}#objective{font-size:10px;max-width:150px}#footer{left:8px;right:8px;bottom:7px;gap:5px}#prompt{font-size:9px;padding:5px 7px;max-width:55%}button{font-size:10px;padding:8px;min-height:35px}#actions{gap:4px}}
@media(orientation:portrait){#hud{position:fixed;top:18px;left:16px;right:16px}#footer{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px}#prompt{font-size:11px}#rotate{display:block;position:fixed;bottom:90px;left:0;right:0;text-align:center;color:#d1ac79;font:11px monospace;letter-spacing:.05em;pointer-events:none}}
</style>
</head>
<body>
<div id="app"><div id="frame">
<canvas id="scene" width="1600" height="900" aria-label="Нулевой узел: нажмите на пол, чтобы идти, и на объекты, чтобы исследовать"></canvas>
<div id="loading">СОЕДИНЕНИЕ С УЗЛОМ...</div>
<div id="hud"><div><h1>CYBERMYCELIUM</h1><div id="place"></div></div><div id="objective"></div></div>
<div id="footer"><div id="prompt">Нажмите на пол, чтобы идти. Осмотрите предметы.</div><div id="actions"><button id="vision" type="button">ЗРЕНИЕ СЕТИ · V</button><button id="journal" type="button">ЖУРНАЛ</button></div></div>
</div><div id="rotate">Для подробного осмотра поверните телефон горизонтально</div></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="panel"><small id="modal-tag"></small><h2 id="modal-title"></h2><p id="modal-body"></p><div id="modal-choices" class="choices"></div><div class="end"><button id="close" type="button">ПРОДОЛЖИТЬ</button></div></div></div>
<script src="./game.js" defer></script>
</body>
</html>
