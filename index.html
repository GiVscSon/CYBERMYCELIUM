<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CYBERMYCELIUM — Нулевой узел</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d0d;color:#e7dfc8;font:14px monospace}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;left:20px;top:18px;pointer-events:none;text-shadow:0 2px 5px #000}#ui b{font-size:21px;letter-spacing:.17em}#message{margin-top:8px;color:#e8b46d}#controls{position:absolute;bottom:18px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px}button{border:1px solid #9c8060;background:#141b1bcc;color:#f1e4c5;border-radius:12px;min-width:64px;height:58px;font:17px monospace;touch-action:none}#left{display:flex;gap:8px}#right{display:flex;gap:8px}@media(min-width:900px){#controls{opacity:.42}}</style><canvas id="game"></canvas><div id="ui"><b>CYBERMYCELIUM</b><div>НУЛЕВОЙ УЗЕЛ · ПРОТОТИП 0.1</div><div id="message">A/D или ←/→ · прыжок Space · сеть V · терминал E</div></div><div id="controls"><div id="left"><button data-key="left">←</button><button data-key="right">→</button></div><div id="right"><button data-key="vision">СЕТЬ</button><button data-key="jump">↑</button><button data-key="interact">E</button></div></div><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),msg=document.querySelector('#message');let W,H,dpr,cam=0,time=0,vision=0,active=localStorage.getItem('cybermycelium-node0')==='1';const keys={},player={x:85,y:0,vx:0,vy:0,ground:false},world=2400,platforms=[{x:0,y:0,w:680},{x:765,y:-45,w:350},{x:1195,y:0,w:1205}],terminal=1760;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function key(e,on){let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=on;if(['arrowright','d'].includes(k))keys.right=on;if([' ','arrowup','w'].includes(k))keys.jump=on;if(k==='v')keys.vision=on;if(k==='e')keys.interact=on;if([' ','arrowup','arrowleft','arrowright'].includes(k))e.preventDefault()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));document.querySelectorAll('button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function line(x,y,X,Y,color,width=2){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}function draw(){time+=.016;const ground=H*.78;vision+=(Number(!!keys.vision)-vision)*.12;let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,vision>.5?'#071e26':'#101919');grad.addColorStop(1,'#242321');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let layer=0;layer<3;layer++){let speed=[.15,.34,.55][layer];for(let i=-1;i<17;i++){let x=i*190-cam*speed,y=ground-55-layer*34;g.fillStyle=['#172324','#233032','#303738'][layer];g.fillRect(x+32,y-130,30,150);ellipse(x+46,y-132,72+layer*12,22,['#283430','#384139','#4b493b'][layer]);for(let j=0;j<5;j++)line(x+30+j*8,y-136,x+47+(j-2)*22,y-113,'#938b6b33')}}let mx=1180-cam*.23;g.fillStyle='#79765a';g.fillRect(mx-45,ground-465,90,440);ellipse(mx,ground-460,350,110,'#9b9776');ellipse(mx,ground-425,310,55,'#494d3d');for(let i=-25;i<=25;i++)line(mx,ground-430,mx+i*12,ground-437+Math.abs(i)*.65,'#c1b69266',1);for(let i=0;i<16;i++){let x=mx+Math.sin(i*13)*270,y=ground-445+Math.cos(i*7)*28;line(x,y,x+Math.sin(i)*30,ground-215,active?'#a46a37aa':'#53646966',1.5)}for(let p of platforms){let x=p.x-cam,y=ground+p.y;g.fillStyle='#343b36';g.fillRect(x,y,p.w,H-y);g.fillStyle='#797259';g.fillRect(x,y-7,p.w,8);for(let i=0;i<p.w;i+=45){line(x+i,y+10,x+i+Math.sin(i)*22,y+70,active?'#bb783c88':'#475d57',3)}}let tx=terminal-cam,ty=ground-52;g.fillStyle='#171c1c';g.fillRect(tx-26,ty-38,52,90);g.strokeStyle='#8c8975';g.strokeRect(tx-26,ty-38,52,90);g.fillStyle=active?'#e1a050':vision>.5?'#66bdd0':'#3d5457';g.fillRect(tx-17,ty-27,34,23);ellipse(tx,ty+18,5,5,g.fillStyle);if(vision>.15){g.globalAlpha=vision*.6;for(let i=0;i<12;i++)line(i*210-cam*.8,ground+Math.sin(i)*18,(i+1)*210-cam*.8,ground+Math.sin(i+1)*18,'#5bc7d0',2);g.globalAlpha=1}let px=player.x-cam,py=player.y;ellipse(px,py-24,12,24,'#10181a');ellipse(px,py-53,9,11,'#222b2a');g.fillStyle='#7ac0c0';g.fillRect(px+3,py-56,6,3);line(px-5,py-5,px-8,py+5,'#151b19',5);line(px+5,py-5,px+8,py+5,'#151b19',5);for(let i=0;i<65;i++){let x=(i*197+time*(i%3+1)*9)%W,y=(i*83+Math.sin(time+i)*25)%H;ellipse(x,y,1.1,1.1,'#d3bc8a55')}if(active){g.fillStyle='#e9ad67';g.font='16px monospace';g.fillText('УЗЕЛ 01 ВОССТАНОВЛЕН // ОБНАРУЖЕН ВНЕШНИЙ ОТВЕТ',Math.max(20,W/2-270),H*.25)}}let last=performance.now();function update(now){let dt=Math.min((now-last)/1000,.033);last=now;let oldY=player.y;player.vx=((keys.right?1:0)-(keys.left?1:0))*240;player.x=Math.max(10,Math.min(world-10,player.x+player.vx*dt));if(keys.jump&&player.ground){player.vy=-480;player.ground=false}player.vy+=1150*dt;player.y+=player.vy*dt;player.ground=false;let ground=H*.78;for(let p of platforms){let top=ground+p.y;if(player.x>=p.x&&player.x<=p.x+p.w&&oldY<=top+5&&player.y>=top&&player.vy>=0){player.y=top;player.vy=0;player.ground=true}}if(player.y>H+120){player.x=85;player.y=ground;player.vy=0}if(keys.interact&&Math.abs(player.x-terminal)<75&&Math.abs(player.y-(ground))<90){active=true;localStorage.setItem('cybermycelium-node0','1');msg.textContent='Ветвь восстановлена. Вдали отвечает неизвестный узел.'}else if(Math.abs(player.x-terminal)<95&&!active)msg.textContent='Нажми E у терминала, чтобы восстановить связь';else if(!active)msg.textContent='A/D или ←/→ · прыжок Space · сеть V · терминал E';cam+=(Math.max(0,Math.min(world-W,player.x-W*.34))-cam)*.07;draw()}player.y=innerHeight*.78;requestAnimationFrame(update);
</script></html>
