name: Deploy CYBERMYCELIUM Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify playable world
        run: |
          node --check game.js
          node tests/runtime.cjs
          node tests/full-cycle.cjs
          node tests/smoke.cjs
          TEST_ENDING=seal node tests/smoke.cjs
          TEST_LEGACY=1 node tests/smoke.cjs
          node tests/branches.cjs
          TEST_BRANCH_ORDER=spores TEST_HEART=open node tests/branches.cjs
          TEST_HEART=seal node tests/branches.cjs
          node tests/spatial.cjs
          node tests/navigation.cjs
          node tests/motion.cjs
          node tests/world.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Complete a new game in Chromium
        env:
          BROWSER_ARTIFACTS_DIR: browser-artifacts
        run: node tests/browser.cjs
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: browser-artifacts
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
